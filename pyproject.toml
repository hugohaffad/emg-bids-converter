[project]
name = "emg-bids-converter"
version = "0.1.0"
description = "Open-source Python package for converting EMG recordings from proprietary formats to the BIDS standard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hugo Haffad", email = "hugo.haffad@utoulouse.fr" }]
requires-python = ">=3.12"
dependencies = [
    "bidsschematools[expressions]>=1.2.7",
    "jsonschema>=4.26.0",
    "numpy>=2.5.3",
    "pyedflib>=0.1.42",
    "xmltodict>=1.0.4",
]

[project.urls]
Homepage = "https://github.com/hugohaffad/emg-bids-converter"
Repository = "https://github.com/hugohaffad/emg-bids-converter"
Issues = "https://github.com/hugohaffad/emg-bids-converter/issues"

[project.scripts]
emg-bids = "emg_bids_converter.cli:main"

[project.gui-scripts]
emg-bids-gui = "emg_bids_converter.gui.app:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
