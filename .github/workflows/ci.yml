name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code
permissions:
  contents: read

# Cancel a running check when a newer commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project from the lockfile
        run: uv sync --locked

      - name: Check that the CLI starts
        run: uv run emg-bids --help

      - name: Run the test suite
        run: uv run pytest
